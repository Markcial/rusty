[package]
name = "wasm"
version = "0.1.0"
authors = ["Marc Garcia Sastre <markcial@gmail.com>"]
edition = "2021"
rust-version = "1.85"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2.129"

[dependencies.web-sys]
version = "0.3.106"
features = [
  'Document',
  'Element',
  'HtmlElement',
  'Node',
  'Window',
]
